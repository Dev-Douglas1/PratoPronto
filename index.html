<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fff22f" />
    <meta name="description" content="PratoPronto - aplicativo de pedidos de pizza" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-192.png" />
    <title>PratoPronto</title>
    <style>
      .startup-card{box-sizing:border-box;width:min(420px,calc(100% - 32px));margin:12vh auto;padding:28px;border:1px solid #ffe234;border-radius:20px;background:#161616;color:#fff;font:16px/1.6 system-ui,sans-serif;text-align:center}
      .startup-card h1{font-size:24px;line-height:1.3}.startup-card p{color:#ddd}.startup-card button,.startup-card a{display:block;box-sizing:border-box;width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#ffe234;color:#171717;font:700 16px/1.4 system-ui,sans-serif;text-decoration:none;cursor:pointer}.startup-card [hidden]{display:none}
    </style>
  </head>
  <body>
    <div id="root"><main class="startup-card"><img src="/icons/app-icon.svg" width="64" height="64" alt="" /><h1>PratoPronto</h1><p id="startup-status" role="status">Abrindo o aplicativo…</p><a id="startup-retry" href="" hidden>Tentar novamente</a><noscript><p>Ative o JavaScript no navegador para abrir o aplicativo.</p></noscript></main></div>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
