<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="pac-title pac-desc">
  <title id="pac-title">PAC — PratoPronto</title>
  <desc id="pac-desc">Mascote amarelo em formato de PAC-Man, com um olho, linhas de movimento e arcos orbitais. Fundo transparente.</desc>
  <defs>
    <radialGradient id="pac-body" cx="42%" cy="32%" r="65%" fx="42%" fy="32%">
      <stop offset="0%" stop-color="#FFF338"/>
      <stop offset="45%" stop-color="#FFDD00"/>
      <stop offset="85%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#E59B00"/>
    </radialGradient>
  </defs>

  <!-- Arcos orbitais -->
  <g fill="none" stroke="#FFC800" stroke-width="12" stroke-linecap="round">
    <path d="M205 60 A185 185 0 0 1 405 155"/>
    <path d="M105 320 A185 185 0 0 0 355 405"/>
  </g>

  <!-- Linhas de movimento -->
  <g fill="none" stroke="#FFC800" stroke-width="14" stroke-linecap="round">
    <path d="M50 180 H160"/>
    <path d="M40 230 H155"/>
    <path d="M60 278 H160"/>
  </g>

  <!-- Corpo do PAC -->
  <path d="M252 235 L348 162 A115 115 0 1 0 348 308 Z"
        fill="url(#pac-body)" stroke="#0D0D0D" stroke-width="18"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Olho -->
  <g transform="translate(285 160) rotate(-10)">
    <ellipse cx="0" cy="0" rx="16" ry="22" fill="#0D0D0D"/>
    <path d="M-18 -8 Q-10 -22 10 -15" fill="none"
          stroke="#0D0D0D" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-4" cy="-7" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Ondas de movimento à direita -->
  <g fill="none" stroke="#FFC800" stroke-width="13" stroke-linecap="round">
    <path d="M365 195 L425 175"/>
    <path d="M365 240 H435"/>
    <path d="M358 285 L418 308"/>
  </g>
</svg>