name: Atualizar lockfile Supabase

on:
  push:
    branches: [codex/multiempresa-piloto-parceiro]
    paths: [package.json]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/multiempresa-piloto-parceiro
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Salvar lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git add package-lock.json
          git commit -m "Atualiza lockfile sem Firebase"
          git push origin HEAD:codex/multiempresa-piloto-parceiro
