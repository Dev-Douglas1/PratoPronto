name: Verificar PratoPronto

on:
  push:
    branches: [main, codex/auditoria-geral-pratopronto, codex/mobile-pwa-security]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Instalar dependências do backend
        run: npm install --prefix functions --ignore-scripts

      - name: Auditar dependências do backend
        run: npm audit --prefix functions --audit-level=high

      - name: Validar backend seguro
        run: npm --prefix functions run check

      - name: Testar Vite em desenvolvimento
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/pratopronto-dev.log 2>&1 &
          DEV_PID=$!
          cleanup() { kill "$DEV_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/pratopronto-dev.log; exit 1; fi
            sleep 0.5
          done

          for route in / /login /cadastro /verificar-email /pizzas /bebidas /pedido /pagamento /acompanhamento /perfil /empresa; do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:5173${route}")
            test "$code" = "200"
            grep -q 'id="root"' /tmp/page.html
          done

          cleanup
          trap - EXIT

      - name: Compilar aplicação
        run: npm run build

      - name: Testar build, PWA e rotas SPA
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pratopronto-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/pratopronto-preview.log; exit 1; fi
            sleep 0.5
          done

          for route in / /login /cadastro /verificar-email /pizzas /bebidas /pedido /pagamento /acompanhamento /perfil /empresa; do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:4173${route}")
            test "$code" = "200"
            grep -q 'id="root"' /tmp/page.html
          done

          curl -fsS http://127.0.0.1:4173/manifest.webmanifest -o /tmp/manifest.json
          grep -q '"display": "standalone"' /tmp/manifest.json
          grep -q '"sizes": "192x192"' /tmp/manifest.json
          grep -q '"sizes": "512x512"' /tmp/manifest.json
          curl -fsS http://127.0.0.1:4173/sw.js >/dev/null
          curl -fsS http://127.0.0.1:4173/pwa-icon.svg >/dev/null
          curl -fsS http://127.0.0.1:4173/icons/icon-192.png >/dev/null
          curl -fsS http://127.0.0.1:4173/icons/icon-512.png >/dev/null
          curl -fsS http://127.0.0.1:4173/icons/apple-touch-icon.png >/dev/null
          curl -fsS http://127.0.0.1:4173/images/produtos/pizza-calabresa.webp >/dev/null

          cleanup
          trap - EXIT
