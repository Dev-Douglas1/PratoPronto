name: Verificar PratoPronto

on:
  push:
    branches: [main, codex/multiempresa-piloto-parceiro]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Testar aplicação
        run: npm test

      - name: Validar configuração Supabase
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
          VITE_CONTROLLER_NAME: PratoPronto
          VITE_PRIVACY_EMAIL: teste@example.com
          VITE_ENABLE_CARD_DEMO: 'false'
        run: npm run check:production

      - name: Testar Vite em desenvolvimento
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/pratopronto-dev.log 2>&1 &
          DEV_PID=$!
          cleanup() { kill "$DEV_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/pratopronto-dev.log; exit 1; fi
            sleep 0.5
          done
          for route in / /login /cadastro /verificar-email /pizzas /bebidas /pedido /pagamento /acompanhamento /perfil /empresa /piloto /loja/pratopronto; do
            code=$(curl -sS -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:5173${route}")
            test "$code" = "200"
            grep -q 'id="root"' /tmp/page.html
          done

      - name: Compilar aplicação
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
        run: npm run build

      - name: Testar build e PWA
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pratopronto-preview.log 2>&1 &
          PREVIEW_PID=$!
          cleanup() { kill "$PREVIEW_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/pratopronto-preview.log; exit 1; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:4173/manifest.webmanifest >/tmp/manifest.json
          grep -q '"display": "standalone"' /tmp/manifest.json
          curl -fsS http://127.0.0.1:4173/sw.js >/dev/null
