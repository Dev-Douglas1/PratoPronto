name: Publicar PratoPronto em produção

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pratopronto-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Verificar segredos e chaves proibidas
        run: npm run check:secrets

      - name: Criar configuração Supabase
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONTROLLER_NAME: ${{ vars.VITE_CONTROLLER_NAME }}
          VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "VITE_CONTROLLER_NAME=$VITE_CONTROLLER_NAME"
            echo "VITE_PRIVACY_EMAIL=$VITE_PRIVACY_EMAIL"
            echo "VITE_ENABLE_CARD_DEMO=false"
          } > .env.production

      - name: Validar configuração de produção
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONTROLLER_NAME: ${{ vars.VITE_CONTROLLER_NAME }}
          VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
          VITE_ENABLE_CARD_DEMO: 'false'
        run: npm run check:production

      - name: Testar aplicação
        run: npm test

      - name: Compilar produção
        run: npm run build

      - name: Salvar artefato web
        uses: actions/upload-artifact@v4
        with:
          name: pratopronto-web
          path: dist/
          if-no-files-found: error

      - name: Preparar credencial do Firebase Hosting
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT não configurado no ambiente production."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Publicar frontend no Firebase Hosting
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_HOSTING_PROJECT_ID || 'pratopronto-d861d' }}
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
