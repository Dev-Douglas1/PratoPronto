name: Preparar PratoPronto para produção

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar configuração Supabase
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONTROLLER_NAME: ${{ vars.VITE_CONTROLLER_NAME }}
          VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
        run: |
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "VITE_CONTROLLER_NAME=$VITE_CONTROLLER_NAME"
            echo "VITE_PRIVACY_EMAIL=$VITE_PRIVACY_EMAIL"
            echo "VITE_ENABLE_CARD_DEMO=false"
          } > .env.production

      - name: Validar configuração
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CONTROLLER_NAME: ${{ vars.VITE_CONTROLLER_NAME }}
          VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
          VITE_ENABLE_CARD_DEMO: 'false'
        run: npm run check:production

      - name: Testar e compilar
        run: |
          npm test
          npm run build

      - name: Salvar artefato web
        uses: actions/upload-artifact@v4
        with:
          name: pratopronto-web
          path: dist/
          if-no-files-found: error
