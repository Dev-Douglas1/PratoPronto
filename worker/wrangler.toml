name = "pratopronto-api"
main = "src/index.js"
compatibility_date = "2026-09-10"

[vars]
FIREBASE_PROJECT_ID = "pratopronto-d861d"
# Project Number / Messaging Sender ID do app Firebase Web.
FIREBASE_PROJECT_NUMBER = "409807022049"
# Produção deve falhar fechado: sem App Check válido, não cria pedido.
REQUIRE_APP_CHECK = "true"
# POST /orders precisa vir de uma origem Web autorizada. Não substitui Auth/App Check;
# é apenas mais uma barreira contra chamadas casuais fora do aplicativo.
REQUIRE_BROWSER_ORIGIN = "true"
# Mantenha true somente durante testes no Codespaces. Troque para false antes do lançamento final.
ALLOW_CODESPACES = "true"
ALLOWED_ORIGINS = "https://pratopronto-d861d.web.app,https://pratopronto-d861d.firebaseapp.com,http://localhost:5173"

# Primeira barreira: no máximo 10 POSTs por minuto por IP antes de acessar Auth/Firestore.
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "731001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Segunda barreira: uma conta autenticada pode tentar confirmar no máximo 3 pedidos por minuto.
[[ratelimits]]
name = "USER_ORDER_RATE_LIMITER"
namespace_id = "731002"

  [ratelimits.simple]
  limit = 3
  period = 60
